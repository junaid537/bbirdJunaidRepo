<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Performance Test - AEM Boilerplate</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
    .block { margin: 10px 0; padding: 10px; background: #f5f5f5; }
    .test-results { background: #e8f5e8; padding: 10px; margin: 10px 0; }
    .test-error { background: #ffe8e8; padding: 10px; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>AEM Boilerplate Performance Test</h1>
  
  <div class="test-results" id="test-results">
    <h2>Testing Code Splitting Implementation...</h2>
  </div>

  <div class="section">
    <h2>First Section (Above the fold)</h2>
    <div class="block hero" data-block-name="hero" data-block-status="initialized">
      <p>Hero block - should load immediately</p>
    </div>
  </div>

  <div class="section">
    <h2>Second Section (Below the fold)</h2>
    <div class="block cards" data-block-name="cards" data-block-status="initialized">
      <p>Cards block - should load lazily</p>
    </div>
  </div>

  <div class="section">
    <h2>Third Section (Heavy block)</h2>
    <div class="block video" data-block-name="video" data-block-status="initialized">
      <p>Video block - should load with stricter lazy loading</p>
    </div>
  </div>

  <script type="module">
    // Test if our modules can be imported correctly
    const testResults = document.getElementById('test-results');
    
    async function runTests() {
      const tests = [];
      
      try {
        // Test 1: Import lazy-loading module
        const lazyLoading = await import('./scripts/lazy-loading.js');
        tests.push('✅ Lazy loading module imported successfully');
        
        // Test 2: Test intersection observer creation
        if (lazyLoading.createIntersectionObserver) {
          const observer = lazyLoading.createIntersectionObserver(() => {}, {});
          tests.push('✅ Intersection observer can be created');
        }
        
        // Test 3: Test preload resources function
        if (lazyLoading.preloadResources) {
          lazyLoading.preloadResources(['/styles/test.css']);
          tests.push('✅ Resource preloading function works');
        }

        // Test 4: Check if delayed.js can be imported
        const delayed = await import('./scripts/delayed.js');
        tests.push('✅ Delayed module imported successfully');

        // Test 5: Check if fonts loading optimization works
        const scripts = await import('./scripts/scripts.js');
        tests.push('✅ Main scripts module imported successfully');

      } catch (error) {
        tests.push(`❌ Error: ${error.message}`);
      }
      
      testResults.innerHTML = `
        <h2>Test Results:</h2>
        ${tests.map(test => `<div>${test}</div>`).join('')}
        <br>
        <p><strong>Performance optimizations implemented:</strong></p>
        <ul>
          <li>Auth0 library moved to dynamic import (saves ~13KB initial load)</li>
          <li>Intersection observer for lazy block loading</li>
          <li>Heavy blocks (video, preflight) load with stricter thresholds</li>
          <li>Header/footer load using requestIdleCallback</li>
          <li>Preflight functionality moved to delayed loading</li>
          <li>Font loading optimization with session storage</li>
          <li>Resource preloading for critical assets</li>
          <li>Web vitals tracking in debug mode</li>
        </ul>
      `;
    }
    
    runTests();
  </script>
</body>
</html>
