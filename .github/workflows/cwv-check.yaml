name: CWV PR Check

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run-cwv-check:
    runs-on: ubuntu-latest
    environment: cwv-check-env-junaid

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install CWV Agent
        run: npm install --no-save git+https://github.com/ramboz/cwv-agent.git

      - name: Use hardcoded AEM URL
        id: extract_urls
        run: echo '["https://main--bbird--aemsites.aem.page/"]' > urls.json

      - name: Run CWV Agent for Each AEM URL
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          AZURE_OPENAI_API_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_API_DEPLOYMENT_NAME }}
          AZURE_OPENAI_API_INSTANCE_NAME: ${{ secrets.AZURE_OPENAI_API_INSTANCE_NAME }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          GOOGLE_PAGESPEED_INSIGHTS_API_KEY: ${{ secrets.GOOGLE_PAGESPEED_INSIGHTS_API_KEY }}
          GOOGLE_CRUX_API_KEY: ${{ secrets.GOOGLE_CRUX_API_KEY }}
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
          PUPPETEER_EXECUTABLE_PATH: "/usr/bin/google-chrome"
        run: |
          set -x
          mkdir -p cwv-output
          echo "Running CWV audits for listed AEM URLs..."
          cat urls.json | jq -r '.[]' | while read URL; do
            echo "🔍 Auditing $URL"
            node node_modules/cwv-agent/index.js --action prompt --url "$URL" --device mobile --model gpt-4o || echo "❌ Mobile audit failed"
            node node_modules/cwv-agent/index.js --action prompt --url "$URL" --device desktop --model gpt-4o || echo "❌ Desktop audit failed"
          done
          
          echo "📂 Checking cache directory..."
          if [ -d "node_modules/cwv-agent/.cache" ]; then
            cp node_modules/cwv-agent/.cache/*.report.gpt4o.summary.md cwv-output/ 2>/dev/null || echo "⚠️ No summary reports found."
            cp node_modules/cwv-agent/.cache/*.suggestions.gpt4o.json cwv-output/ 2>/dev/null || echo "⚠️ No suggestions found."
            ls -la cwv-output/
          else
            echo "❌ Cache directory not found"
          fi

      - name: Create Issues and Automated PRs
        id: create_issues_and_prs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const cwvOutputDir = 'cwv-output';
            const createdItems = [];
            const prNumber = context.issue.number;
            
            // Get the original PR author
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const originalAuthor = pr.data.user.login;
            
            // Helper functions
            function createIssueTitle(suggestion, url, deviceType) {
              const urlHost = new URL(url).hostname.split('.')[0];
              return `[CWV-${deviceType.toUpperCase()}] ${suggestion.title} - ${urlHost}`;
            }
            
            function createBranchName(suggestion, deviceType, issueNumber) {
              const metric = (suggestion.metric || 'performance').toLowerCase().replace(/[^a-z0-9]/g, '');
              const category = (suggestion.category || 'optimization').toLowerCase().replace(/[^a-z0-9]/g, '');
              return `cwv-fix-${issueNumber}-${metric}-${category}-${deviceType}`;
            }
            
            function generateOptimizationCode(suggestion, url, deviceType) {
              // Generate actual code based on the suggestion
              let codeChanges = [];
              
              if (suggestion.category?.toLowerCase() === 'javascript') {
                codeChanges.push({
                  file: 'scripts/scripts.js',
                  content: `// CWV Optimization: ${suggestion.title}
            // Metric: ${suggestion.metric} | Device: ${deviceType}
            // Expected Impact: ${suggestion.impact}
            
            // Defer non-critical JavaScript
            function deferNonCritical() {
              const scripts = document.querySelectorAll('script[data-defer="true"]');
              scripts.forEach(script => {
                script.defer = true;
              });
            }
            
            // Optimize script loading
            function optimizeScriptLoading() {
              // Implementation based on: ${suggestion.description}
              ${suggestion.codeExample || '// Add specific optimization code here'}
            }
            
            // Initialize optimization
            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', optimizeScriptLoading);
            } else {
              optimizeScriptLoading();
            }
            `
                });
              }
              
              if (suggestion.category?.toLowerCase().includes('css') || suggestion.category?.toLowerCase().includes('style')) {
                codeChanges.push({
                  file: 'styles/styles.css',
                  content: `/* CWV Optimization: ${suggestion.title} */
            /* Metric: ${suggestion.metric} | Device: ${deviceType} */
            /* Expected Impact: ${suggestion.impact} */
            
            /* Critical CSS optimization */
            .optimize-loading {
              content-visibility: auto;
              contain-intrinsic-size: 200px;
            }
            
            /* Reduce layout shift */
            img, video {
              aspect-ratio: attr(width) / attr(height);
              height: auto;
            }
            
            /* Implementation: ${suggestion.description} */
            `
                });
              }
              
              if (suggestion.category?.toLowerCase().includes('image')) {
                codeChanges.push({
                  file: 'scripts/lib-franklin.js',
                  content: `// Image optimization for CWV
            // ${suggestion.title}
            
            function optimizeImages() {
              const images = document.querySelectorAll('img');
              images.forEach(img => {
                // Add loading="lazy" for non-critical images
                if (!img.closest('[data-critical]')) {
                  img.loading = 'lazy';
                }
                
                // Add fetchpriority for LCP images
                if (img.closest('[data-lcp]')) {
                  img.fetchPriority = 'high';
                }
              });
            }
            
            // Initialize on DOM ready
            document.addEventListener('DOMContentLoaded', optimizeImages);
            `
                });
              }
              
              return codeChanges;
            }
            
            function createPRBody(suggestion, url, deviceType, issueNumber) {
              return `## 🚀 CWV Performance Optimization PR

            **Fixes Issue**: #${issueNumber}
            **URL**: ${url}
            **Device**: ${deviceType}
            **Metric**: ${suggestion.metric}
            **Expected Impact**: ${suggestion.impact}

            ## 📊 Performance Optimization Details
            
            - **Priority**: ${suggestion.priority}
            - **Effort**: ${suggestion.effort}
            - **Category**: ${suggestion.category}
            
            ## 🛠️ Changes Made
            
            ${suggestion.description}
            
            ## 🎯 Implementation
            
            This PR implements the following optimizations:
            - Targeted ${suggestion.metric} improvements
            - ${deviceType}-specific optimizations
            - AEM EDS best practices maintained
            
            ${suggestion.implementation ? `### Implementation Details:\n${suggestion.implementation}` : ''}
            
            ## 🧪 Testing
            
            Please test this optimization on:
            - ${url}
            - Both mobile and desktop devices
            - Monitor ${suggestion.metric} metric improvements
            
            ---
            🤖 *Auto-generated PR for CWV optimization*
            `;
            }
            
            async function createOptimizationPR(suggestion, url, deviceType, issueNumber) {
              const branchName = createBranchName(suggestion, deviceType, issueNumber);
              const prTitle = `CWV Fix: ${suggestion.title} (${deviceType})`;
              const prBody = createPRBody(suggestion, url, deviceType, issueNumber);
              
              try {
                // Get the default branch
                const repo = await github.rest.repos.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                });
                const defaultBranch = repo.data.default_branch;
                
                // Get the latest commit SHA from default branch
                const ref = await github.rest.git.getRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${defaultBranch}`,
                });
                const baseSha = ref.data.object.sha;
                
                // Create new branch
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/heads/${branchName}`,
                  sha: baseSha,
                });
                
                console.log(`✅ Created branch: ${branchName}`);
                
                // Generate and commit optimization code
                const codeChanges = generateOptimizationCode(suggestion, url, deviceType);
                
                for (const change of codeChanges) {
                  try {
                    // Try to get existing file
                    let existingFile;
                    let existingSha;
                    try {
                      const fileResponse = await github.rest.repos.getContent({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        path: change.file,
                        ref: branchName,
                      });
                      existingFile = Buffer.from(fileResponse.data.content, 'base64').toString();
                      existingSha = fileResponse.data.sha;
                    } catch (error) {
                      // File doesn't exist, we'll create it
                      existingFile = '';
                      existingSha = null;
                    }
                    
                    // Append or create file content
                    const newContent = existingFile ? 
                      `${existingFile}\n\n${change.content}` : 
                      change.content;
                    
                    // Create or update file
                    await github.rest.repos.createOrUpdateFileContents({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      path: change.file,
                      message: `CWV optimization: ${suggestion.title} (${deviceType})`,
                      content: Buffer.from(newContent).toString('base64'),
                      branch: branchName,
                      sha: existingSha,
                    });
                    
                    console.log(`✅ Updated file: ${change.file}`);
                  } catch (fileError) {
                    console.log(`⚠️ Could not update ${change.file}: ${fileError.message}`);
                  }
                }
                
                // Create pull request
                const pullRequest = await github.rest.pulls.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: prTitle,
                  head: branchName,
                  base: defaultBranch,
                  body: prBody,
                });
                
                // Assign to original author
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pullRequest.data.number,
                  assignees: [originalAuthor],
                });
                
                // Add labels
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pullRequest.data.number,
                  labels: ['performance', 'cwv-optimization', `device-${deviceType}`, `metric-${suggestion.metric?.toLowerCase()}`],
                });
                
                console.log(`✅ Created PR #${pullRequest.data.number}: ${prTitle}`);
                return pullRequest.data.number;
                
              } catch (error) {
                console.log(`❌ Failed to create PR for ${suggestion.title}: ${error.message}`);
                return null;
              }
            }
            
            // Main processing logic
            try {
              if (!fs.existsSync(cwvOutputDir)) {
                console.log('❌ CWV output directory not found');
                return [];
              }
              
              const suggestionFiles = fs.readdirSync(cwvOutputDir)
                .filter(file => file.endsWith('.suggestions.gpt4o.json'));
              
              console.log(`Found ${suggestionFiles.length} suggestion files`);
              
              for (const filename of suggestionFiles) {
                const filepath = path.join(cwvOutputDir, filename);
                
                try {
                  const content = fs.readFileSync(filepath, 'utf8');
                  const data = JSON.parse(content);
                  
                  const url = data.url;
                  const deviceType = data.deviceType;
                  const suggestions = data.suggestions || [];
                  
                  console.log(`📄 Processing ${suggestions.length} suggestions for ${url} (${deviceType})`);
                  
                  for (const suggestion of suggestions.slice(0, 3)) { // Limit to 3 per device to avoid spam
                    // Create issue
                    const issueTitle = createIssueTitle(suggestion, url, deviceType);
                    const issueBody = `## 🚀 Core Web Vitals Performance Issue

            **URL**: ${url}
            **Device**: ${deviceType}
            **Metric**: ${suggestion.metric}
            **Priority**: ${suggestion.priority}
            **Expected Impact**: ${suggestion.impact}

            ## Description
            ${suggestion.description}

            ## Implementation
            ${suggestion.implementation || 'See automated PR for implementation details.'}

            ---
            🤖 *An automated PR will be created for this optimization*`;

                    const issue = await github.rest.issues.create({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      title: issueTitle,
                      body: issueBody,
                      labels: ['performance', 'cwv-optimization', `device-${deviceType}`],
                    });
                    
                    console.log(`✅ Created issue #${issue.data.number}: ${issueTitle}`);
                    
                    // Wait a moment then create PR
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    
                    const prNumber = await createOptimizationPR(suggestion, url, deviceType, issue.data.number);
                    
                    createdItems.push({
                      issueNumber: issue.data.number,
                      prNumber: prNumber,
                      title: issueTitle,
                      metric: suggestion.metric,
                      device: deviceType
                    });
                    
                    // Rate limiting delay
                    await new Promise(resolve => setTimeout(resolve, 3000));
                  }
                } catch (error) {
                  console.log(`❌ Failed to process file ${filename}: ${error.message}`);
                }
              }
              
              console.log(`\n📊 Summary: Created ${createdItems.length} issues with automated PRs`);
              return createdItems;
              
            } catch (error) {
              console.log('❌ Error in automation process:', error.message);
              throw error;
            }

      - name: Comment on Original PR with Results
        if: steps.create_issues_and_prs.outputs.result != '[]'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const results = ${{ steps.create_issues_and_prs.outputs.result }};
            
            if (results.length === 0) {
              console.log('No items were created to comment about');
              return;
            }
            
            const itemsList = results.map(item => 
              `- **${item.title}**\n  - Issue: #${item.issueNumber}\n  - PR: ${item.prNumber ? `#${item.prNumber}` : 'Failed to create'}\n  - Metric: ${item.metric} | Device: ${item.device}`
            ).join('\n\n');
            
            const comment = `## 🚀 Automated CWV Optimization Complete!

            ✨ **Successfully created ${results.length} automated performance optimizations:**

            ${itemsList}

            ### 🎯 What was automated:
            - ✅ **Issues Created**: Each with detailed performance analysis
            - 🔧 **PRs Generated**: With actual code implementations  
            - 📊 **Code Changes**: Targeted optimizations for each metric
            - 🏷️ **Labels Applied**: Organized by device type and performance metric
            - 👤 **Auto-Assigned**: All PRs assigned to @${context.payload.pull_request.user.login}

            ### 📈 Next Steps:
            1. **Review the PRs** - Each contains specific performance optimizations
            2. **Test locally** - Verify the changes work with your AEM setup
            3. **Measure impact** - Check Core Web Vitals improvements
            4. **Merge when ready** - Performance gains should be measurable

            ---
            🎉 **Fully automated CWV optimization with real code changes!**`;
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: cwv-reports
          path: cwv-output/
          if-no-files-found: warn
          retention-days: 7

