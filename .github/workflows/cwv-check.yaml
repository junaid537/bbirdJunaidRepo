name: CWV PR Check

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run-cwv-check:
    runs-on: ubuntu-latest
    environment: cwv-check-env-junaid

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install CWV Agent
        run: npm install --no-save git+https://github.com/ramboz/cwv-agent.git

      - name: Use hardcoded AEM URL
        id: extract_urls
        run: echo '["https://main--bbird--aemsites.aem.page/"]' > urls.json

      - name: Run CWV Agent for Each AEM URL
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          AZURE_OPENAI_API_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_API_DEPLOYMENT_NAME }}
          AZURE_OPENAI_API_INSTANCE_NAME: ${{ secrets.AZURE_OPENAI_API_INSTANCE_NAME }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          GOOGLE_PAGESPEED_INSIGHTS_API_KEY: ${{ secrets.GOOGLE_PAGESPEED_INSIGHTS_API_KEY }}
          GOOGLE_CRUX_API_KEY: ${{ secrets.GOOGLE_CRUX_API_KEY }}
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
          PUPPETEER_EXECUTABLE_PATH: "/usr/bin/google-chrome"
        run: |
          set -x
          mkdir -p cwv-output
          cat urls.json | jq -r '.[]' | while read URL; do
            node node_modules/cwv-agent/index.js --action prompt --url "$URL" --device mobile --model gpt-4o || echo "❌ Mobile audit failed"
            node node_modules/cwv-agent/index.js --action prompt --url "$URL" --device desktop --model gpt-4o || echo "❌ Desktop audit failed"
          done
          if [ -d "node_modules/cwv-agent/.cache" ]; then
            cp node_modules/cwv-agent/.cache/*.report.gpt4o.summary.md cwv-output/ 2>/dev/null || echo "⚠️ No summary reports found."
            cp node_modules/cwv-agent/.cache/*.suggestions.gpt4o.json cwv-output/ 2>/dev/null || echo "⚠️ No suggestions found."
          else
            echo "❌ Cache directory not found"
          fi

      - name: Create GitHub Issues with Copilot PR Trigger
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = 'cwv-output';
            if (!fs.existsSync(dir)) return;
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.suggestions.gpt4o.json'));
            for (const file of files) {
              const json = JSON.parse(fs.readFileSync(`${dir}/${file}`, 'utf8'));
              const url = json.url;
              const deviceType = json.deviceType;
              for (const s of json.suggestions || []) {
                const title = `[CWV-${deviceType.toUpperCase()}] ${s.title}`;
                const body = `## URL: ${url}\n**Metric**: ${s.metric}\n**Priority**: ${s.priority}\n\n${s.description}\n\n${s.implementation || ''}`;
                const labels = [
                  'copilot:run',
                  'copilot-ready',
                  ...((s.metric || 'unknown').split(',').map(m => `cwv-${m.trim().toLowerCase()}`)),
                  `priority-${(s.priority || 'medium').toLowerCase()}`,
                  `device-${deviceType}`,
                  `category-${(s.category || 'general').toLowerCase().replace(/[^a-z0-9]/g, '-')}`
                ].filter(label => !label.includes(','));

                const issue = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels
                });

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.data.number,
                  body: `@github-copilot please create a PR to fix this CWV issue.\n\nDetails:\n- URL: ${url}\n- Metric: ${s.metric}\n- Priority: ${s.priority}\n- Description: ${s.description}`
                });
              }
            }



